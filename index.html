<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoque de Carros — Cobel</title>
<style>
  :root{
    --azul:#1a4d8f; --azul-esc:#0d2f5c; --verde:#2e9e5b; --vermelho:#d64545;
    --laranja:#e0932c; --cinza:#6b7280; --bg:#f4f6f9; --branco:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif;}
  body{background:var(--bg);color:#222;}
  header{background:var(--azul-esc);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  header h1{font-size:20px;}
  nav button{background:transparent;border:1px solid #ffffff55;color:#fff;padding:8px 14px;border-radius:6px;margin-left:6px;cursor:pointer;font-size:14px;}
  nav button.ativo{background:var(--azul);border-color:var(--azul);}
  main{padding:20px;max-width:1100px;margin:0 auto;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  input,select{padding:9px 12px;border:1px solid #ccc;border-radius:6px;font-size:14px;}
  input[type=text]{flex:1;min-width:180px;}
  button.acao{background:var(--azul);color:#fff;border:none;padding:9px 16px;border-radius:6px;cursor:pointer;font-size:14px;}
  button.acao:hover{background:var(--azul-esc);}
  button.secundario{background:var(--cinza);}
  button.perigo{background:var(--vermelho);}
  button.sucesso{background:var(--verde);}
  .grid-carros{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
  .card-carro{background:var(--branco);border-radius:10px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.1);cursor:pointer;border-left:5px solid var(--verde);position:relative;}
  .card-carro.atrasado{border-left-color:var(--vermelho);}
  .card-carro h3{font-size:16px;margin-bottom:4px;}
  .card-carro p{font-size:13px;color:#555;margin:2px 0;}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:12px;color:#fff;margin-top:6px;}
  .badge.ok{background:var(--verde);}
  .badge.atraso{background:var(--vermelho);}
  .thumb{width:100%;height:120px;object-fit:cover;border-radius:6px;background:#e5e7eb;margin-bottom:8px;}
  .modal-fundo{position:fixed;inset:0;background:#00000080;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 12px;z-index:50;}
  .modal-fundo.aberto{display:flex;}
  .modal{background:#fff;border-radius:10px;max-width:640px;width:100%;padding:24px;}
  .modal h2{margin-bottom:14px;color:var(--azul-esc);}
  .campo{margin-bottom:12px;}
  .campo label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:#444;}
  .campo input,.campo select{width:100%;}
  .linha-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .fechar{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:#888;}
  .tabs{display:flex;gap:6px;margin:16px 0 10px;border-bottom:2px solid #e5e7eb;}
  .tabs button{background:none;border:none;padding:8px 14px;cursor:pointer;font-size:14px;color:#666;border-bottom:2px solid transparent;margin-bottom:-2px;}
  .tabs button.ativo{color:var(--azul);border-color:var(--azul);font-weight:600;}
  .item-historico,.item-pendencia{background:#f9fafb;border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .item-pendencia.concluida{opacity:.55;text-decoration:line-through;}
  .toast{position:fixed;bottom:20px;right:20px;background:#222;color:#fff;padding:12px 18px;border-radius:8px;display:none;z-index:100;font-size:14px;}
  .toast.mostrar{display:block;}
  .fotos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:8px;}
  .fotos-grid img{width:100%;height:80px;object-fit:cover;border-radius:6px;cursor:pointer;}
  .carregando{text-align:center;color:#888;padding:30px;}
  .vazio{text-align:center;color:#888;padding:30px;font-style:italic;}
  .filtro-atraso{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--vermelho);cursor:pointer;}
</style>
</head>
<body>

<header>
  <h1>🚗 Estoque de Carros — Cobel</h1>
  <nav>
    <button id="tabEstoque" class="ativo">Estoque</button>
    <button id="tabVendidos">Vendidos</button>
  </nav>
</header>

<main>
  <div class="toolbar">
    <input type="text" id="busca" placeholder="Buscar por chassi, modelo ou cor...">
    <label class="filtro-atraso"><input type="checkbox" id="filtroAtraso"> ⚠️ Só bateria atrasada</label>
    <button class="acao" id="btnNovoCarro">+ Novo Carro</button>
  </div>

  <div id="listaCarros" class="grid-carros"></div>
</main>

<!-- MODAL: FICHA DO CARRO -->
<div class="modal-fundo" id="modalFicha">
  <div class="modal" style="max-width:720px;">
    <button class="fechar" onclick="fecharModal('modalFicha')">&times;</button>
    <h2 id="fichaTitulo">Carro</h2>
    <div id="fichaDados"></div>

    <div class="fotos-grid" id="fichaFotosGerais"></div>
    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
      <label class="acao" style="background:var(--cinza);cursor:pointer;">📷 Foto geral
        <input type="file" accept="image/*" capture="environment" style="display:none" onchange="enviarFoto(event,'geral')">
      </label>
      <label class="acao" style="background:var(--laranja);cursor:pointer;">⚠️ Foto de avaria
        <input type="file" accept="image/*" capture="environment" style="display:none" onchange="enviarFoto(event,'avaria')">
      </label>
      <button class="acao sucesso" onclick="registrarInspecao()">🔋 Registrar inspeção de bateria</button>
      <button class="acao perigo" onclick="abrirModalVenda()">Marcar como vendido</button>
    </div>

    <div class="tabs">
      <button id="tabHistorico" class="ativo" onclick="mudarSubTab('historico')">Histórico</button>
      <button id="tabPendencias" onclick="mudarSubTab('pendencias')">Pendências</button>
    </div>

    <div id="subHistorico">
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <input type="text" id="novoHistoricoTexto" placeholder="Descreva o que foi feito...">
        <button class="acao" onclick="salvarHistorico()">Adicionar</button>
      </div>
      <div id="listaHistorico"></div>
    </div>

    <div id="subPendencias" style="display:none;">
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <input type="text" id="novaPendenciaTexto" placeholder="Ex: instalar película...">
        <select id="novaPendenciaPrioridade">
          <option value="Normal">Normal</option>
          <option value="Alta">Alta</option>
          <option value="Urgente">Urgente</option>
        </select>
        <button class="acao" onclick="salvarPendencia()">Adicionar</button>
      </div>
      <div id="listaPendencias"></div>
    </div>
  </div>
</div>

<!-- MODAL: NOVO CARRO -->
<div class="modal-fundo" id="modalNovoCarro">
  <div class="modal">
    <button class="fechar" onclick="fecharModal('modalNovoCarro')">&times;</button>
    <h2>Novo Carro no Estoque</h2>
    <div class="campo"><label>Chassi *</label><input type="text" id="novoChassi"></div>
    <div class="linha-2">
      <div class="campo"><label>Modelo *</label><input type="text" id="novoModelo"></div>
      <div class="campo"><label>Cor *</label><input type="text" id="novoCor"></div>
    </div>
    <div class="linha-2">
      <div class="campo"><label>Ano</label><input type="text" id="novoAno"></div>
      <div class="campo"><label>Placa</label><input type="text" id="novoPlaca"></div>
    </div>
    <div class="campo"><label>Data de entrada</label><input type="date" id="novoDataEntrada"></div>
    <button class="acao" style="width:100%;margin-top:10px;" onclick="salvarNovoCarro()">Cadastrar</button>
  </div>
</div>

<!-- MODAL: VENDA -->
<div class="modal-fundo" id="modalVenda">
  <div class="modal">
    <button class="fechar" onclick="fecharModal('modalVenda')">&times;</button>
    <h2>Marcar carro como vendido</h2>
    <div class="campo"><label>Data da venda</label><input type="date" id="dataVenda"></div>
    <button class="acao perigo" style="width:100%;" onclick="confirmarVenda()">Confirmar venda</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================
   CONFIGURAÇÃO — troque pela URL do seu Apps Script (/exec)
   ===================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxFoyDfZGKndTUnJgOJHthfON1CRjc1FEb5Im0R-2VLOa9GGnRu8V6BZZDqVEUtWvNy/exec';

let carrosCache = [];
let chassiAtual = null;
let subTabAtual = 'historico';

// ---------- utilitários ----------
function mostrarToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('mostrar');
  setTimeout(()=>t.classList.remove('mostrar'), 2800);
}
function abrirModal(id){ document.getElementById(id).classList.add('aberto'); }
function fecharModal(id){ document.getElementById(id).classList.remove('aberto'); }

async function chamarApi(params){
  const url = API_URL + '?' + new URLSearchParams(params).toString();
  const resp = await fetch(url);
  return resp.json();
}
async function chamarApiPost(corpo){
  const resp = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(corpo)
  });
  return resp.json();
}

// ---------- carregar estoque ----------
async function carregarCarros(){
  document.getElementById('listaCarros').innerHTML = '<div class="carregando">Carregando estoque...</div>';
  try{
    const dados = await chamarApi({action:'listarCarros'});
    carrosCache = dados.carros || [];
    renderizarLista();
  }catch(e){
    document.getElementById('listaCarros').innerHTML = '<div class="vazio">Erro ao carregar. Verifique a URL da API.</div>';
  }
}

function renderizarLista(){
  const busca = document.getElementById('busca').value.trim().toLowerCase();
  const soAtraso = document.getElementById('filtroAtraso').checked;
  let filtrados = carrosCache.filter(c =>
    (c.Chassi||'').toLowerCase().includes(busca) ||
    (c.Modelo||'').toLowerCase().includes(busca) ||
    (c.Cor||'').toLowerCase().includes(busca)
  );
  if(soAtraso) filtrados = filtrados.filter(c => c.inspecaoAtrasada);

  const cont = document.getElementById('listaCarros');
  if(filtrados.length === 0){
    cont.innerHTML = '<div class="vazio">Nenhum carro encontrado.</div>';
    return;
  }
  cont.innerHTML = filtrados.map(c => `
    <div class="card-carro ${c.inspecaoAtrasada ? 'atrasado':''}" onclick="abrirFicha('${c.Chassi}')">
      <h3>${c.Modelo}</h3>
      <p>Chassi: ${c.Chassi}</p>
      <p>Cor: ${c.Cor} · Ano: ${c.Ano||'-'}</p>
      <span class="badge ${c.inspecaoAtrasada?'atraso':'ok'}">
        ${c.inspecaoAtrasada ? '⚠️ Bateria atrasada ('+c.diasDesdeInspecao+'d)' : '🔋 Bateria em dia'}
      </span>
    </div>
  `).join('');
}

document.getElementById('busca').addEventListener('input', renderizarLista);
document.getElementById('filtroAtraso').addEventListener('change', renderizarLista);

// ---------- ficha do carro ----------
async function abrirFicha(chassi){
  chassiAtual = chassi;
  abrirModal('modalFicha');
  document.getElementById('fichaDados').innerHTML = '<div class="carregando">Carregando...</div>';
  const dados = await chamarApi({action:'obterCarro', chassi});
  if(dados.erro){ mostrarToast(dados.erro); return; }

  const c = dados.carro;
  document.getElementById('fichaTitulo').textContent = `${c.Modelo} — ${c.Chassi}`;
  document.getElementById('fichaDados').innerHTML = `
    <p><b>Cor:</b> ${c.Cor} &nbsp; <b>Ano:</b> ${c.Ano||'-'} &nbsp; <b>Placa:</b> ${c.Placa||'-'}</p>
    <p><b>Entrada no estoque:</b> ${c.DataEntrada}</p>
    <p><b>Última inspeção de bateria:</b> ${c.DataUltimaInspecaoBateria || '-'}
      ${c.inspecaoAtrasada ? `<span class="badge atraso">Atrasada (${c.diasDesdeInspecao}d)</span>` : `<span class="badge ok">Em dia</span>`}
    </p>
  `;

  const fotosGerais = JSON.parse(c.FotosGeraisJSON || '[]');
  const fotosAvarias = JSON.parse(c.FotosAvariasJSON || '[]');
  document.getElementById('fichaFotosGerais').innerHTML =
    fotosGerais.map(u=>`<img src="${u}" onclick="window.open('${u}','_blank')">`).join('') +
    fotosAvarias.map(u=>`<img src="${u}" style="border:2px solid var(--vermelho)" onclick="window.open('${u}','_blank')">`).join('');

  renderizarHistorico(dados.historico || []);
  renderizarPendencias(dados.pendencias || []);
  mudarSubTab('historico');
}

function renderizarHistorico(lista){
  const cont = document.getElementById('listaHistorico');
  if(lista.length===0){ cont.innerHTML = '<div class="vazio">Sem registros ainda.</div>'; return; }
  cont.innerHTML = lista.map(h => `
    <div class="item-historico">
      <div><b>${h.Data}</b> — ${h.Descricao}</div>
    </div>
  `).join('');
}

function renderizarPendencias(lista){
  const cont = document.getElementById('listaPendencias');
  if(lista.length===0){ cont.innerHTML = '<div class="vazio">Nenhuma pendência.</div>'; return; }
  cont.innerHTML = lista.map(p => `
    <div class="item-pendencia ${p.Status==='Concluído'?'concluida':''}">
      <div>${p.Item} <small>(${p.Prioridade})</small></div>
      ${p.Status!=='Concluído' ? `<button class="acao sucesso" onclick="concluirPendencia('${p.Id}')">Concluir</button>` : '✅'}
    </div>
  `).join('');
}

function mudarSubTab(tab){
  subTabAtual = tab;
  document.getElementById('tabHistorico').classList.toggle('ativo', tab==='historico');
  document.getElementById('tabPendencias').classList.toggle('ativo', tab==='pendencias');
  document.getElementById('subHistorico').style.display = tab==='historico' ? 'block':'none';
  document.getElementById('subPendencias').style.display = tab==='pendencias' ? 'block':'none';
}

// ---------- ações da ficha ----------
async function salvarHistorico(){
  const texto = document.getElementById('novoHistoricoTexto').value.trim();
  if(!texto) return;
  await chamarApiPost({action:'adicionarHistorico', chassi: chassiAtual, descricao: texto});
  document.getElementById('novoHistoricoTexto').value = '';
  mostrarToast('Registrado no histórico.');
  abrirFicha(chassiAtual);
}

async function salvarPendencia(){
  const texto = document.getElementById('novaPendenciaTexto').value.trim();
  const prioridade = document.getElementById('novaPendenciaPrioridade').value;
  if(!texto) return;
  await chamarApiPost({action:'adicionarPendencia', chassi: chassiAtual, item: texto, prioridade});
  document.getElementById('novaPendenciaTexto').value = '';
  mostrarToast('Pendência adicionada.');
  abrirFicha(chassiAtual);
}

async function concluirPendencia(id){
  await chamarApiPost({action:'concluirPendencia', id});
  mostrarToast('Pendência concluída!');
  abrirFicha(chassiAtual);
}

async function registrarInspecao(){
  await chamarApiPost({action:'registrarInspecaoBateria', chassi: chassiAtual});
  mostrarToast('Inspeção de bateria registrada.');
  abrirFicha(chassiAtual);
  carregarCarros();
}

function abrirModalVenda(){ abrirModal('modalVenda'); }
async function confirmarVenda(){
  const data = document.getElementById('dataVenda').value;
  await chamarApiPost({action:'marcarVendido', chassi: chassiAtual, dataVenda: data});
  fecharModal('modalVenda');
  fecharModal('modalFicha');
  mostrarToast('Carro marcado como vendido.');
  carregarCarros();
}

// ---------- fotos ----------
function enviarFoto(event, categoria){
  const arquivo = event.target.files[0];
  if(!arquivo) return;
  const leitor = new FileReader();
  leitor.onload = async function(){
    const base64 = leitor.result.split(',')[1];
    mostrarToast('Enviando foto...');
    await chamarApiPost({
      action:'uploadFoto', chassi: chassiAtual, nomeArquivo: arquivo.name,
      base64, tipoMime: arquivo.type, categoria
    });
    mostrarToast('Foto enviada!');
    abrirFicha(chassiAtual);
  };
  leitor.readAsDataURL(arquivo);
}

// ---------- novo carro ----------
document.getElementById('btnNovoCarro').addEventListener('click', ()=>abrirModal('modalNovoCarro'));
async function salvarNovoCarro(){
  const dados = {
    chassi: document.getElementById('novoChassi').value.trim(),
    modelo: document.getElementById('novoModelo').value.trim(),
    cor: document.getElementById('novoCor').value.trim(),
    ano: document.getElementById('novoAno').value.trim(),
    placa: document.getElementById('novoPlaca').value.trim(),
    dataEntrada: document.getElementById('novoDataEntrada').value
  };
  if(!dados.chassi || !dados.modelo || !dados.cor){
    mostrarToast('Preencha chassi, modelo e cor.'); return;
  }
  await chamarApiPost({action:'cadastrarCarro', dados});
  fecharModal('modalNovoCarro');
  mostrarToast('Carro cadastrado!');
  carregarCarros();
}

// ---------- aba vendidos ----------
document.getElementById('tabEstoque').addEventListener('click', ()=>{
  document.getElementById('tabEstoque').classList.add('ativo');
  document.getElementById('tabVendidos').classList.remove('ativo');
  carregarCarros();
});
document.getElementById('tabVendidos').addEventListener('click', async ()=>{
  document.getElementById('tabVendidos').classList.add('ativo');
  document.getElementById('tabEstoque').classList.remove('ativo');
  const cont = document.getElementById('listaCarros');
  cont.innerHTML = '<div class="carregando">Carregando vendidos...</div>';
  const dados = await chamarApi({action:'listarVendidos'});
  const lista = dados.vendidos || [];
  if(lista.length===0){ cont.innerHTML = '<div class="vazio">Nenhum carro vendido ainda.</div>'; return; }
  cont.innerHTML = lista.map(c => `
    <div class="card-carro" style="border-left-color:var(--cinza);cursor:default;">
      <h3>${c.Modelo}</h3>
      <p>Chassi: ${c.Chassi}</p>
      <p>Cor: ${c.Cor} · Ano: ${c.Ano||'-'}</p>
      <p><b>Vendido em:</b> ${c.DataVenda}</p>
    </div>
  `).join('');
});

// ---------- inicialização ----------
carregarCarros();
</script>
</body>
</html>
