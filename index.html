<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoque de Carros — Cobel</title>
<style>
  :root{
    --primary:#0f172a; --primary-2:#1e293b; --accent:#0d9488; --accent-esc:#0f766e;
    --vermelho:#dc2626; --laranja:#d97706; --cinza:#64748b; --borda:#e2e8f0;
    --bg:#f1f5f9; --branco:#fff; --texto:#1e293b; --texto-suave:#64748b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--texto);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  }
  header{
    background:var(--primary);color:#fff;padding:16px 28px;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  }
  header h1{font-size:19px;font-weight:600;letter-spacing:.2px;}
  header h1 span{color:var(--accent);}
  nav{display:flex;gap:8px;align-items:center;}
  nav button{
    background:transparent;border:1px solid #ffffff30;color:#cbd5e1;
    padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;
    transition:.15s;
  }
  nav button.ativo{background:var(--accent);border-color:var(--accent);color:#fff;}
  nav button.sair{border-color:#ffffff20;color:#94a3b8;}
  main{padding:24px;max-width:1150px;margin:0 auto;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center;}
  input,select{
    padding:10px 13px;border:1px solid var(--borda);border-radius:7px;font-size:14px;
    background:#fff;color:var(--texto);
  }
  input:focus,select:focus{outline:none;border-color:var(--accent);}
  input[type=text]{flex:1;min-width:200px;}
  button.acao{
    background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:7px;
    cursor:pointer;font-size:14px;font-weight:500;transition:.15s;
  }
  button.acao:hover{background:var(--accent-esc);}
  button.secundario{background:#e2e8f0;color:var(--texto);}
  button.secundario:hover{background:#cbd5e1;}
  button.perigo{background:var(--vermelho);}
  button.perigo:hover{background:#b91c1c;}
  .grid-carros{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .card-carro{
    background:var(--branco);border-radius:10px;padding:16px;
    box-shadow:0 1px 2px rgba(15,23,42,.06);cursor:pointer;
    border-left:4px solid var(--accent);transition:.15s;
  }
  .card-carro:hover{box-shadow:0 4px 12px rgba(15,23,42,.1);}
  .card-carro.atrasado{border-left-color:var(--vermelho);}
  .card-carro.vendido-card{border-left-color:var(--cinza);}
  .card-carro h3{font-size:16px;margin-bottom:6px;color:var(--primary);}
  .card-carro p{font-size:13px;color:var(--texto-suave);margin:2px 0;}
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;color:#fff;margin-top:8px;}
  .badge.ok{background:var(--accent);}
  .badge.atraso{background:var(--vermelho);}
  .modal-fundo{
    position:fixed;inset:0;background:#0f172acc;display:none;
    align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 12px;z-index:50;
  }
  .modal-fundo.aberto{display:flex;}
  .modal{background:#fff;border-radius:12px;max-width:680px;width:100%;padding:28px;}
  .modal h2{margin-bottom:16px;color:var(--primary);font-size:19px;}
  .campo{margin-bottom:14px;}
  .campo label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--texto-suave);}
  .campo input,.campo select{width:100%;}
  .linha-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .fechar{float:right;background:none;border:none;font-size:22px;cursor:pointer;color:#94a3b8;line-height:1;}
  .tabs{display:flex;gap:4px;margin:20px 0 12px;border-bottom:2px solid var(--borda);}
  .tabs button{
    background:none;border:none;padding:9px 16px;cursor:pointer;font-size:14px;
    color:var(--texto-suave);border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:500;
  }
  .tabs button.ativo{color:var(--accent);border-color:var(--accent);font-weight:600;}
  .item-historico,.item-pendencia{
    background:#f8fafc;border-radius:8px;padding:11px 14px;margin-bottom:8px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--borda);
  }
  .item-pendencia.concluida{opacity:.5;text-decoration:line-through;}
  .toast{
    position:fixed;bottom:24px;right:24px;background:var(--primary);color:#fff;
    padding:13px 20px;border-radius:8px;display:none;z-index:100;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.2);
  }
  .toast.mostrar{display:block;}
  .fotos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:10px;}
  .fotos-grid img{width:100%;height:80px;object-fit:cover;border-radius:7px;cursor:pointer;}
  .carregando{text-align:center;color:var(--texto-suave);padding:40px;}
  .vazio{text-align:center;color:var(--texto-suave);padding:30px;font-style:italic;}
  .filtro-atraso{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--vermelho);cursor:pointer;font-weight:500;}
  .checklist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .checklist label{
    display:flex;align-items:center;gap:8px;font-size:14px;background:#f8fafc;
    padding:9px 12px;border-radius:7px;border:1px solid var(--borda);cursor:pointer;
  }
  .checklist input{width:auto;}
  .aviso-vendido{
    background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:10px 14px;
    border-radius:8px;font-size:13px;margin-bottom:14px;
  }

  /* ---------- TELA DE LOGIN ---------- */
  #telaLogin{
    position:fixed;inset:0;background:var(--primary);
    display:flex;align-items:center;justify-content:center;z-index:200;
  }
  .caixa-login{
    background:#fff;border-radius:14px;padding:36px 32px;width:100%;max-width:360px;
    box-shadow:0 10px 40px rgba(0,0,0,.3);
  }
  .caixa-login h2{color:var(--primary);margin-bottom:4px;font-size:20px;}
  .caixa-login p{color:var(--texto-suave);font-size:13px;margin-bottom:20px;}
  .caixa-login .campo{margin-bottom:14px;}
  .caixa-login button{width:100%;margin-top:6px;}
  .erro-login{color:var(--vermelho);font-size:13px;margin-top:10px;display:none;}
</style>
</head>
<body>

<!-- ===================== TELA DE LOGIN ===================== -->
<div id="telaLogin">
  <div class="caixa-login">
    <h2>🚗 Estoque de Carros</h2>
    <p>Acesso restrito à equipe técnica — Cobel</p>
    <div class="campo"><label>Usuário</label><input type="text" id="loginUsuario"></div>
    <div class="campo"><label>Senha</label><input type="password" id="loginSenha"></div>
    <button class="acao" onclick="fazerLogin()">Entrar</button>
    <div class="erro-login" id="erroLogin"></div>
  </div>
</div>

<div id="app" style="display:none;">
<header>
  <h1>🚗 Estoque de Carros — <span>Cobel</span></h1>
  <nav>
    <button id="tabEstoque" class="ativo">Estoque</button>
    <button id="tabVendidos">Vendidos</button>
    <button class="sair" onclick="sair()">Sair</button>
  </nav>
</header>

<main>
  <div class="toolbar">
    <input type="text" id="busca" placeholder="Buscar por chassi, modelo ou cor...">
    <label class="filtro-atraso"><input type="checkbox" id="filtroAtraso"> ⚠️ Só bateria atrasada</label>
    <button class="acao" id="btnNovoCarro">+ Novo Carro</button>
  </div>

  <div id="listaCarros" class="grid-carros"></div>
</main>
</div>

<!-- MODAL: FICHA DO CARRO -->
<div class="modal-fundo" id="modalFicha">
  <div class="modal" style="max-width:720px;">
    <button class="fechar" onclick="fecharModal('modalFicha')">&times;</button>
    <h2 id="fichaTitulo">Carro</h2>
    <div id="avisoVendido" class="aviso-vendido" style="display:none;">
      Este carro já foi vendido. Você está vendo o histórico apenas para consulta.
    </div>
    <div id="fichaDados"></div>

    <div class="fotos-grid" id="fichaFotosGerais"></div>
    <div id="acoesFicha" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
      <label class="acao secundario" style="cursor:pointer;">📷 Foto geral
        <input type="file" accept="image/*" capture="environment" style="display:none" onchange="enviarFoto(event,'geral')">
      </label>
      <label class="acao secundario" style="cursor:pointer;">⚠️ Foto de avaria
        <input type="file" accept="image/*" capture="environment" style="display:none" onchange="enviarFoto(event,'avaria')">
      </label>
      <button class="acao" onclick="registrarInspecao()">🔋 Registrar inspeção de bateria</button>
      <button class="acao perigo" onclick="abrirModalVenda()">Marcar como vendido</button>
    </div>

    <div class="tabs">
      <button id="tabHistorico" class="ativo" onclick="mudarSubTab('historico')">Histórico</button>
      <button id="tabPendencias" onclick="mudarSubTab('pendencias')">Serviços pendentes</button>
    </div>

    <div id="subHistorico">
      <div style="display:flex;gap:8px;margin-bottom:12px;" id="formHistorico">
        <input type="text" id="novoHistoricoTexto" placeholder="Descreva o que foi feito...">
        <button class="acao" onclick="salvarHistorico()">Adicionar</button>
      </div>
      <div id="listaHistorico"></div>
    </div>

    <div id="subPendencias" style="display:none;">
      <div id="formPendencias">
        <p style="font-size:13px;color:var(--texto-suave);margin-bottom:8px;">Marque os serviços que precisam ser feitos:</p>
        <div class="checklist" id="checklistServicos"></div>
        <div class="campo" id="campoLocalMartelinho" style="display:none;">
          <label>Local exato da avaria (para o martelinho de ouro)</label>
          <input type="text" id="localMartelinho" placeholder="Ex: porta dianteira direita">
        </div>
        <div class="linha-2" style="margin-bottom:10px;">
          <input type="text" id="novoServicoOutro" placeholder="Outro serviço (opcional)...">
          <button class="acao" onclick="salvarPendencias()">Adicionar selecionados</button>
        </div>
      </div>
      <div id="listaPendencias"></div>
    </div>
  </div>
</div>

<!-- MODAL: NOVO CARRO -->
<div class="modal-fundo" id="modalNovoCarro">
  <div class="modal">
    <button class="fechar" onclick="fecharModal('modalNovoCarro')">&times;</button>
    <h2>Novo Carro no Estoque</h2>
    <div class="campo"><label>Chassi *</label><input type="text" id="novoChassi"></div>
    <div class="linha-2">
      <div class="campo"><label>Modelo *</label><input type="text" id="novoModelo"></div>
      <div class="campo"><label>Cor *</label><input type="text" id="novoCor"></div>
    </div>
    <div class="campo"><label>Ano</label><input type="text" id="novoAno"></div>
    <div class="campo"><label>Data de entrada</label><input type="date" id="novoDataEntrada"></div>
    <button class="acao" style="width:100%;margin-top:8px;" onclick="salvarNovoCarro()">Cadastrar</button>
  </div>
</div>

<!-- MODAL: VENDA -->
<div class="modal-fundo" id="modalVenda">
  <div class="modal">
    <button class="fechar" onclick="fecharModal('modalVenda')">&times;</button>
    <h2>Marcar carro como vendido</h2>
    <div class="campo"><label>Data da venda</label><input type="date" id="dataVenda"></div>
    <button class="acao perigo" style="width:100%;" onclick="confirmarVenda()">Confirmar venda</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================
   CONFIGURAÇÃO
   ===================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxFoyDfZGKndTUnJgOJHthfON1CRjc1FEb5Im0R-2VLOa9GGnRu8V6BZZDqVEUtWvNy/exec';

// Serviços do checklist de preparação/entrega. Ajuste essa lista à vontade.
const SERVICOS_PADRAO = [
  'Vitrificação',
  'Aplicação de película',
  'Martelinho de ouro (funilaria)',
  'Polimento',
  'Higienização interna',
  'Instalação de acessórios',
  'Revisão de PDI'
];

let carrosCache = [];
let chassiAtual = null;
let carroAtualVendido = false;

// ---------- login ----------
function fazerLogin(){
  const usuario = document.getElementById('loginUsuario').value.trim();
  const senha = document.getElementById('loginSenha').value;
  const erroEl = document.getElementById('erroLogin');
  erroEl.style.display = 'none';

  fetch(API_URL, {method:'POST', body: JSON.stringify({action:'login', usuario, senha})})
    .then(r => r.json())
    .then(dados => {
      if(dados.sucesso){
        localStorage.setItem('cobel_autenticado', '1');
        mostrarApp();
      } else {
        erroEl.textContent = dados.erro || 'Não foi possível entrar.';
        erroEl.style.display = 'block';
      }
    })
    .catch(()=>{
      erroEl.textContent = 'Erro de conexão. Tente novamente.';
      erroEl.style.display = 'block';
    });
}

function sair(){
  localStorage.removeItem('cobel_autenticado');
  location.reload();
}

function mostrarApp(){
  document.getElementById('telaLogin').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  montarChecklist();
  carregarCarros();
}

// verifica se já está autenticado
if(localStorage.getItem('cobel_autenticado') === '1'){
  mostrarApp();
}

// ---------- utilitários ----------
function mostrarToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('mostrar');
  setTimeout(()=>t.classList.remove('mostrar'), 2800);
}
function abrirModal(id){ document.getElementById(id).classList.add('aberto'); }
function fecharModal(id){ document.getElementById(id).classList.remove('aberto'); }

async function chamarApi(params){
  const url = API_URL + '?' + new URLSearchParams(params).toString();
  const resp = await fetch(url);
  return resp.json();
}
async function chamarApiPost(corpo){
  const resp = await fetch(API_URL, { method: 'POST', body: JSON.stringify(corpo) });
  return resp.json();
}

// ---------- checklist de serviços ----------
function montarChecklist(){
  const cont = document.getElementById('checklistServicos');
  cont.innerHTML = SERVICOS_PADRAO.map(s => `
    <label>
      <input type="checkbox" class="chk-servico" value="${s}" onchange="verificarMartelinho()">
      ${s}
    </label>
  `).join('');
}
function verificarMartelinho(){
  const marcado = Array.from(document.querySelectorAll('.chk-servico'))
    .some(c => c.checked && c.value.includes('Martelinho'));
  document.getElementById('campoLocalMartelinho').style.display = marcado ? 'block' : 'none';
}

// ---------- carregar estoque ----------
async function carregarCarros(){
  document.getElementById('listaCarros').innerHTML = '<div class="carregando">Carregando estoque...</div>';
  try{
    const dados = await chamarApi({action:'listarCarros'});
    carrosCache = dados.carros || [];
    renderizarLista();
  }catch(e){
    document.getElementById('listaCarros').innerHTML = '<div class="vazio">Erro ao carregar. Verifique a URL da API.</div>';
  }
}

function renderizarLista(){
  const busca = document.getElementById('busca').value.trim().toLowerCase();
  const soAtraso = document.getElementById('filtroAtraso').checked;
  let filtrados = carrosCache.filter(c =>
    (c.Chassi||'').toLowerCase().includes(busca) ||
    (c.Modelo||'').toLowerCase().includes(busca) ||
    (c.Cor||'').toLowerCase().includes(busca)
  );
  if(soAtraso) filtrados = filtrados.filter(c => c.inspecaoAtrasada);

  const cont = document.getElementById('listaCarros');
  if(filtrados.length === 0){
    cont.innerHTML = '<div class="vazio">Nenhum carro encontrado.</div>';
    return;
  }
  cont.innerHTML = filtrados.map(c => `
    <div class="card-carro ${c.inspecaoAtrasada ? 'atrasado':''}" onclick="abrirFicha('${c.Chassi}')">
      <h3>${c.Modelo}</h3>
      <p>Chassi: ${c.Chassi}</p>
      <p>Cor: ${c.Cor} · Ano: ${c.Ano||'-'}</p>
      <span class="badge ${c.inspecaoAtrasada?'atraso':'ok'}">
        ${c.inspecaoAtrasada ? '⚠️ Bateria atrasada ('+c.diasDesdeInspecao+'d)' : '🔋 Bateria em dia'}
      </span>
    </div>
  `).join('');
}

document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('busca').addEventListener('input', renderizarLista);
  document.getElementById('filtroAtraso').addEventListener('change', renderizarLista);
  document.getElementById('btnNovoCarro').addEventListener('click', ()=>abrirModal('modalNovoCarro'));

  document.getElementById('tabEstoque').addEventListener('click', ()=>{
    document.getElementById('tabEstoque').classList.add('ativo');
    document.getElementById('tabVendidos').classList.remove('ativo');
    carregarCarros();
  });
  document.getElementById('tabVendidos').addEventListener('click', carregarVendidos);
});

async function carregarVendidos(){
  document.getElementById('tabVendidos').classList.add('ativo');
  document.getElementById('tabEstoque').classList.remove('ativo');
  const cont = document.getElementById('listaCarros');
  cont.innerHTML = '<div class="carregando">Carregando vendidos...</div>';
  const dados = await chamarApi({action:'listarVendidos'});
  const lista = dados.vendidos || [];
  if(lista.length===0){ cont.innerHTML = '<div class="vazio">Nenhum carro vendido ainda.</div>'; return; }
  cont.innerHTML = lista.map(c => `
    <div class="card-carro vendido-card" onclick="abrirFicha('${c.Chassi}')">
      <h3>${c.Modelo}</h3>
      <p>Chassi: ${c.Chassi}</p>
      <p>Cor: ${c.Cor} · Ano: ${c.Ano||'-'}</p>
      <p><b>Vendido em:</b> ${c.DataVenda}</p>
    </div>
  `).join('');
}

// ---------- ficha do carro ----------
async function abrirFicha(chassi){
  chassiAtual = chassi;
  abrirModal('modalFicha');
  document.getElementById('fichaDados').innerHTML = '<div class="carregando">Carregando...</div>';
  const dados = await chamarApi({action:'obterCarro', chassi});
  if(dados.erro){ mostrarToast(dados.erro); return; }

  const c = dados.carro;
  carroAtualVendido = !!dados.vendido;

  document.getElementById('fichaTitulo').textContent = `${c.Modelo} — ${c.Chassi}`;
  document.getElementById('avisoVendido').style.display = carroAtualVendido ? 'block' : 'none';
  document.getElementById('acoesFicha').style.display = carroAtualVendido ? 'none' : 'flex';
  document.getElementById('formHistorico').style.display = carroAtualVendido ? 'none' : 'flex';
  document.getElementById('formPendencias').style.display = carroAtualVendido ? 'none' : 'block';

  let infoInspecao = '';
  if(!carroAtualVendido){
    infoInspecao = `<p><b>Última inspeção de bateria:</b> ${c.DataUltimaInspecaoBateria || '-'}
      ${c.inspecaoAtrasada ? `<span class="badge atraso">Atrasada (${c.diasDesdeInspecao}d)</span>` : `<span class="badge ok">Em dia</span>`}
    </p>`;
  } else {
    infoInspecao = `<p><b>Vendido em:</b> ${c.DataVenda}</p>`;
  }

  document.getElementById('fichaDados').innerHTML = `
    <p><b>Cor:</b> ${c.Cor} &nbsp; <b>Ano:</b> ${c.Ano||'-'}</p>
    <p><b>Entrada no estoque:</b> ${c.DataEntrada}</p>
    ${infoInspecao}
  `;

  const fotosGerais = JSON.parse(c.FotosGeraisJSON || '[]');
  const fotosAvarias = JSON.parse(c.FotosAvariasJSON || '[]');
  document.getElementById('fichaFotosGerais').innerHTML =
    fotosGerais.map(u=>`<img src="${u}" onclick="window.open('${u}','_blank')">`).join('') +
    fotosAvarias.map(u=>`<img src="${u}" style="border:2px solid var(--vermelho)" onclick="window.open('${u}','_blank')">`).join('');

  renderizarHistorico(dados.historico || []);
  renderizarPendencias(dados.pendencias || []);
  mudarSubTab('historico');

  // desmarca checklist de serviços da vez anterior
  document.querySelectorAll('.chk-servico').forEach(c=>c.checked=false);
  document.getElementById('novoServicoOutro').value = '';
  document.getElementById('campoLocalMartelinho').style.display = 'none';
  document.getElementById('localMartelinho').value = '';
}

function renderizarHistorico(lista){
  const cont = document.getElementById('listaHistorico');
  if(lista.length===0){ cont.innerHTML = '<div class="vazio">Sem registros ainda.</div>'; return; }
  cont.innerHTML = lista.map(h => `
    <div class="item-historico">
      <div><b>${h.Data}</b> — ${h.Descricao}</div>
    </div>
  `).join('');
}

function renderizarPendencias(lista){
  const cont = document.getElementById('listaPendencias');
  if(lista.length===0){ cont.innerHTML = '<div class="vazio">Nenhum serviço pendente.</div>'; return; }
  cont.innerHTML = lista.map(p => `
    <div class="item-pendencia ${p.Status==='Concluído'?'concluida':''}">
      <div>${p.Item}${p.Local ? ' — <i>'+p.Local+'</i>' : ''}</div>
      ${p.Status!=='Concluído' && !carroAtualVendido ? `<button class="acao secundario" onclick="concluirPendencia('${p.Id}')">Concluir</button>` : (p.Status==='Concluído' ? '✅' : '')}
    </div>
  `).join('');
}

function mudarSubTab(tab){
  document.getElementById('tabHistorico').classList.toggle('ativo', tab==='historico');
  document.getElementById('tabPendencias').classList.toggle('ativo', tab==='pendencias');
  document.getElementById('subHistorico').style.display = tab==='historico' ? 'block':'none';
  document.getElementById('subPendencias').style.display = tab==='pendencias' ? 'block':'none';
}

// ---------- ações da ficha ----------
async function salvarHistorico(){
  const texto = document.getElementById('novoHistoricoTexto').value.trim();
  if(!texto) return;
  await chamarApiPost({action:'adicionarHistorico', chassi: chassiAtual, descricao: texto});
  document.getElementById('novoHistoricoTexto').value = '';
  mostrarToast('Registrado no histórico.');
  abrirFicha(chassiAtual);
}

async function salvarPendencias(){
  const selecionados = Array.from(document.querySelectorAll('.chk-servico'))
    .filter(c => c.checked).map(c => c.value);
  const outro = document.getElementById('novoServicoOutro').value.trim();
  const local = document.getElementById('localMartelinho').value.trim();

  if(selecionados.length === 0 && !outro){
    mostrarToast('Selecione ao menos um serviço.');
    return;
  }

  for(const servico of selecionados){
    const localParaEsse = servico.includes('Martelinho') ? local : '';
    await chamarApiPost({action:'adicionarPendencia', chassi: chassiAtual, item: servico, local: localParaEsse});
  }
  if(outro){
    await chamarApiPost({action:'adicionarPendencia', chassi: chassiAtual, item: outro, local: ''});
  }
  mostrarToast('Serviços adicionados.');
  abrirFicha(chassiAtual);
}

async function concluirPendencia(id){
  await chamarApiPost({action:'concluirPendencia', id});
  mostrarToast('Serviço concluído!');
  abrirFicha(chassiAtual);
}

async function registrarInspecao(){
  await chamarApiPost({action:'registrarInspecaoBateria', chassi: chassiAtual});
  mostrarToast('Inspeção de bateria registrada.');
  abrirFicha(chassiAtual);
  carregarCarros();
}

function abrirModalVenda(){ abrirModal('modalVenda'); }
async function confirmarVenda(){
  const data = document.getElementById('dataVenda').value;
  await chamarApiPost({action:'marcarVendido', chassi: chassiAtual, dataVenda: data});
  fecharModal('modalVenda');
  fecharModal('modalFicha');
  mostrarToast('Carro marcado como vendido.');
  carregarCarros();
}

// ---------- fotos ----------
function enviarFoto(event, categoria){
  const arquivo = event.target.files[0];
  if(!arquivo) return;
  const leitor = new FileReader();
  leitor.onload = async function(){
    const base64 = leitor.result.split(',')[1];
    mostrarToast('Enviando foto...');
    await chamarApiPost({
      action:'uploadFoto', chassi: chassiAtual, nomeArquivo: arquivo.name,
      base64, tipoMime: arquivo.type, categoria
    });
    mostrarToast('Foto enviada!');
    abrirFicha(chassiAtual);
  };
  leitor.readAsDataURL(arquivo);
}

// ---------- novo carro ----------
async function salvarNovoCarro(){
  const dados = {
    chassi: document.getElementById('novoChassi').value.trim(),
    modelo: document.getElementById('novoModelo').value.trim(),
    cor: document.getElementById('novoCor').value.trim(),
    ano: document.getElementById('novoAno').value.trim(),
    dataEntrada: document.getElementById('novoDataEntrada').value
  };
  if(!dados.chassi || !dados.modelo || !dados.cor){
    mostrarToast('Preencha chassi, modelo e cor.'); return;
  }
  await chamarApiPost({action:'cadastrarCarro', dados});
  fecharModal('modalNovoCarro');
  mostrarToast('Carro cadastrado!');
  carregarCarros();
}
</script>
